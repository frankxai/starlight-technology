name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify supported toolchain
        run: pnpm verify:toolchain
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Verify hardware editorial planner
        run: node --test scripts/editorial/plan.test.mjs
      - name: Build
        run: pnpm build
      - name: Install pinned Chromium tooling in the ephemeral runner
        env:
          STARLIGHT_PLAYWRIGHT_DIR: ${{ runner.temp }}/creator-playwright
        run: |
          npm install --prefix "$STARLIGHT_PLAYWRIGHT_DIR" --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          node "$STARLIGHT_PLAYWRIGHT_DIR/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify Creator Studio browser recovery
        env:
          STARLIGHT_PLAYWRIGHT_DIR: ${{ runner.temp }}/creator-playwright
        run: node scripts/creator-studio-browser.mjs
      - name: Preserve browser behavior receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-studio-browser
          path: ${{ runner.temp }}/creator-studio-browser-results
          if-no-files-found: ignore
